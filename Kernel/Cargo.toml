[package]
name = "lixin-kernel"
version = "0.0.1"
edition = "2024"

[features]
window-console = []
retina = ["window-console"]
split = ["retina"]

[profile.window]
inherits = "release"

[profile.retina]
inherits = "release"

[profile.split]
inherits = "release"

[dependencies]
fdt = "0.1.5"
linked_list_allocator = { version = "0.10", default-features = false }
virtio-drivers = { version = "0.13", default-features = false, features = ["alloc"] }

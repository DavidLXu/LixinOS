[package]
name = "lixin-kernel"
version = "0.1.0"
edition = "2024"

[features]
window-console = []
ssh-mux = []
retina = ["window-console"]
split = ["retina"]

[profile.window]
inherits = "release"

[profile.retina]
inherits = "release"

[profile.split]
inherits = "release"

[dependencies]
fdt = "0.1.5"
linked_list_allocator = { version = "0.10", default-features = false }
serde = { version = "1.0.229", default-features = false, features = ["alloc", "derive"] }
serde-json-wasm = { version = "1.0.1", default-features = false }
smoltcp = { version = "0.12", default-features = false, features = ["alloc", "medium-ethernet", "proto-ipv4", "socket-tcp"] }
virtio-drivers = { version = "0.13", default-features = false, features = ["alloc"] }

[package]
name = "lixin-ssh"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["staticlib"]

[dependencies]
sunset = { version = "=0.6.0", default-features = false }
getrandom = "0.4"
sha2 = { version = "0.11", default-features = false }
base64ct = { version = "1", default-features = false }
zeroize = { version = "1", default-features = false }
heapless = "0.9"

[profile.release]
panic = "abort"
opt-level = "s"
lto = true

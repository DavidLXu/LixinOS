<?xml version="1.0"?>
<fontconfig>
  <dir>/usr/share/fonts</dir>
  <dir>/lib/gtk3/fonts</dir>
  <cachedir>/tmp</cachedir>
  <alias>
    <family>sans-serif</family>
    <prefer><family>Fira Sans</family><family>Noto Sans Mono CJK SC</family></prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer><family>JetBrains Mono</family><family>Noto Sans Mono CJK SC</family></prefer>
  </alias>
</fontconfig>
